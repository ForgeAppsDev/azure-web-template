name: Validate infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'bootstrap/**'
      - 'provision/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'infra/**'
      - 'bootstrap/**'
      - 'provision/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build main template
        run: az bicep build --file infra/main.bicep
      - name: Build parameter profiles
        run: |
          az bicep build-params --file infra/profiles/static.bicepparam
          az bicep build-params --file infra/profiles/serverless.bicepparam
          az bicep build-params --file infra/profiles/advanced.bicepparam
      - name: Build control-plane templates
        run: |
          az bicep build --file bootstrap/bootstrap.bicep
          az bicep build --file provision/provision-site.bicep
      - name: Validate GitHub Actions syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
