name: Provision site

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Client repository name, for example client-wisniowy-piec'
        required: true
        type: string
      repositoryId:
        description: 'Numeric GitHub repository ID (supports private client repositories without cross-repo tokens)'
        required: true
        type: string
      projectName:
        description: 'Lowercase Azure project slug, for example wisniowy-piec'
        required: true
        type: string
      branch:
        description: 'Existing client deployment branch'
        required: true
        default: main
        type: string
      profile:
        description: 'Infrastructure profile'
        required: true
        type: choice
        options:
          - static
          - serverless
          - advanced
      environment:
        description: 'Deployment environment'
        required: true
        default: prod
        type: choice
        options:
          - dev
          - test
          - staging
          - prod
      location:
        description: 'Azure region supporting selected services'
        required: true
        default: westeurope
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    if: github.repository == 'ForgeAppsDev/azure-web-template'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.repository }}" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "${{ inputs.projectName }}" =~ ^[a-z0-9][a-z0-9-]{1,39}$ ]]
          [[ "${{ inputs.location }}" =~ ^[a-z0-9]+$ ]]
          [[ "${{ inputs.branch }}" =~ ^[A-Za-z0-9_./-]+$ ]]

      - name: Validate shared Cosmos input
        if: inputs.profile != 'static'
        env:
          SHARED_COSMOS_ACCOUNT_NAME: ${{ vars.SHARED_COSMOS_ACCOUNT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SHARED_COSMOS_ACCOUNT_NAME" ]]; then
            echo "::error::Set SHARED_COSMOS_ACCOUNT_NAME in the central repository after creating the Free Tier account."
            exit 1
          fi

      - name: Azure login with central provisioner OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PROVISIONER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create isolated client deployment boundary
        id: provision
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_ID: ${{ github.repository_owner_id }}
          CLIENT_REPOSITORY: ${{ inputs.repository }}
          CLIENT_REPOSITORY_ID: ${{ inputs.repositoryId }}
          CLIENT_BRANCH: ${{ inputs.branch }}
          SHARED_COSMOS_ACCOUNT_NAME: ${{ vars.SHARED_COSMOS_ACCOUNT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLIENT_REPOSITORY_ID" =~ ^[0-9]+$ ]]
          repository_id="$CLIENT_REPOSITORY_ID"
          subject="repo:${GH_OWNER}@${GH_OWNER_ID}/${CLIENT_REPOSITORY}@${repository_id}:ref:refs/heads/${CLIENT_BRANCH}"
          deployment_args=(--parameters
            repository="${{ inputs.repository }}"
            githubSubject="$subject"
            projectName="${{ inputs.projectName }}"
            profile="${{ inputs.profile }}"
            environmentName="${{ inputs.environment }}"
            location="${{ inputs.location }}")
          if [[ "${{ inputs.profile }}" != "static" ]]; then
            deployment_args+=(sharedCosmosAccountName="$SHARED_COSMOS_ACCOUNT_NAME")
          fi
          outputs=$(az deployment sub create \
            --name "provision-${{ inputs.projectName }}-${{ inputs.environment }}" \
            --location "${{ inputs.location }}" \
            --template-file provision/provision-site.bicep \
            "${deployment_args[@]}" \
            --query properties.outputs \
            --output json)

          for pair in \
            "AZURE_CLIENT_ID:azureClientId" \
            "AZURE_TENANT_ID:azureTenantId" \
            "AZURE_SUBSCRIPTION_ID:azureSubscriptionId" \
            "AZURE_RESOURCE_GROUP:azureResourceGroup" \
            "AZURE_LOCATION:azureLocation" \
            "PROJECT_NAME:projectNameValue" \
            "SITE_PROFILE:siteProfile" \
            "ENVIRONMENT_NAME:environmentNameValue" \
            "COSMOS_ENDPOINT:cosmosEndpoint" \
            "COSMOS_DATABASE:cosmosDatabaseName" \
            "COSMOS_CONTAINER:cosmosContainerName" \
            "PROJECT_KEY:cosmosProjectKey"; do
            variable_name=${pair%%:*}
            output_name=${pair##*:}
            value=$(jq -r --arg key "$output_name" '.[$key].value' <<< "$outputs")
            echo "${variable_name}=${value}" >> "$GITHUB_OUTPUT"
          done

      - name: Write GitHub Variables handoff
        shell: bash
        env:
          TARGET_REPOSITORY: ForgeAppsDev/${{ inputs.repository }}
        run: |
          {
            echo "### Azure provisioning complete"
            echo "The client Resource Group, deployment identity, OIDC credential and RG-scoped RBAC are ready."
            echo
            echo "The central repository token cannot modify another repository's Actions variables."
            echo "Run these commands once with GitHub CLI authenticated as the repository owner:"
            echo '```bash'
            printf 'gh variable set AZURE_CLIENT_ID --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.AZURE_CLIENT_ID }}"
            printf 'gh variable set AZURE_TENANT_ID --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.AZURE_TENANT_ID }}"
            printf 'gh variable set AZURE_SUBSCRIPTION_ID --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.AZURE_SUBSCRIPTION_ID }}"
            printf 'gh variable set AZURE_RESOURCE_GROUP --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.AZURE_RESOURCE_GROUP }}"
            printf 'gh variable set AZURE_LOCATION --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.AZURE_LOCATION }}"
            printf 'gh variable set PROJECT_NAME --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.PROJECT_NAME }}"
            printf 'gh variable set SITE_PROFILE --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.SITE_PROFILE }}"
            printf 'gh variable set ENVIRONMENT_NAME --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.ENVIRONMENT_NAME }}"
            if [[ -n "${{ steps.provision.outputs.COSMOS_ENDPOINT }}" ]]; then
              printf 'gh variable set COSMOS_ENDPOINT --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.COSMOS_ENDPOINT }}"
              printf 'gh variable set COSMOS_DATABASE --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.COSMOS_DATABASE }}"
              printf 'gh variable set COSMOS_CONTAINER --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.COSMOS_CONTAINER }}"
              printf 'gh variable set PROJECT_KEY --repo %q --body %q\n' "$TARGET_REPOSITORY" "${{ steps.provision.outputs.PROJECT_KEY }}"
            fi
            echo '```'
            echo "After setting the variables, run the client repo's **Deploy site** workflow or push to \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
