name: Reusable Azure deployment

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      profile:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      location:
        required: true
        type: string
      static_web_app_location:
        required: false
        default: 'westeurope'
        type: string
      resource_group:
        required: true
        type: string
      azure_client_id:
        required: true
        type: string
      azure_tenant_id:
        required: true
        type: string
      azure_subscription_id:
        required: true
        type: string
      frontend_path:
        required: false
        default: '.'
        type: string
      frontend_output_path:
        required: false
        default: 'dist'
        type: string
      functions_path:
        required: false
        default: 'api'
        type: string
      cosmos_endpoint:
        required: false
        type: string
      cosmos_database:
        required: false
        type: string
      cosmos_container:
        required: false
        type: string
      project_key:
        required: false
        type: string
      auth_metadata_url:
        required: false
        type: string
      auth_audience:
        required: false
        type: string
      auth_authority:
        required: false
        type: string
      auth_client_id:
        required: false
        type: string
      auth_api_scope:
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: azure-${{ inputs.resource_group }}
      cancel-in-progress: false
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Checkout central infrastructure
        uses: actions/checkout@v4
        with:
          repository: ForgeAppsDev/azure-web-template
          ref: main
          path: .platform

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.profile }}" =~ ^(static|serverless|advanced)$ ]]
          [[ "${{ inputs.environment_name }}" =~ ^(dev|test|staging|prod)$ ]]
          [[ "${{ inputs.project_name }}" =~ ^[a-z0-9][a-z0-9-]{1,39}$ ]]

      - name: Validate serverless configuration
        if: inputs.profile != 'static'
        env:
          COSMOS_ENDPOINT: ${{ inputs.cosmos_endpoint }}
          COSMOS_DATABASE: ${{ inputs.cosmos_database }}
          COSMOS_CONTAINER: ${{ inputs.cosmos_container }}
          PROJECT_KEY: ${{ inputs.project_key }}
          AUTH_METADATA_URL: ${{ inputs.auth_metadata_url }}
          AUTH_AUDIENCE: ${{ inputs.auth_audience }}
          AUTH_AUTHORITY: ${{ inputs.auth_authority }}
          AUTH_CLIENT_ID: ${{ inputs.auth_client_id }}
          AUTH_API_SCOPE: ${{ inputs.auth_api_scope }}
        shell: bash
        run: |
          set -euo pipefail
          for name in COSMOS_ENDPOINT COSMOS_DATABASE COSMOS_CONTAINER PROJECT_KEY AUTH_METADATA_URL AUTH_AUDIENCE AUTH_AUTHORITY AUTH_CLIENT_ID AUTH_API_SCOPE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a serverless deployment."
              exit 1
            fi
          done

      - name: Azure login with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Deploy or update Azure infrastructure
        id: infrastructure
        shell: bash
        run: |
          set -euo pipefail
          outputs=$(az deployment group create \
            --name "site-${{ github.run_id }}-${{ github.run_attempt }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file .platform/infra/main.bicep \
            --parameters \
              projectName="${{ inputs.project_name }}" \
              environmentName="${{ inputs.environment_name }}" \
              profile="${{ inputs.profile }}" \
              location="${{ inputs.location }}" \
              staticWebAppLocation="${{ inputs.static_web_app_location }}" \
              cosmosEndpoint="${{ inputs.cosmos_endpoint }}" \
              cosmosDatabase="${{ inputs.cosmos_database }}" \
              cosmosContainer="${{ inputs.cosmos_container }}" \
              projectKey="${{ inputs.project_key }}" \
              authMetadataUrl="${{ inputs.auth_metadata_url }}" \
              authAudience="${{ inputs.auth_audience }}" \
            --query properties.outputs \
            --output json)
          {
            echo "static_web_app=$(jq -r '.staticWebAppName.value' <<< "$outputs")"
            echo "function_app=$(jq -r '.functionAppName.value' <<< "$outputs")"
            echo "function_hostname=$(jq -r '.functionAppHostname.value' <<< "$outputs")"
          } >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.profile }}" != "static" ]]; then
            echo "VITE_API_BASE_URL=https://$(jq -r '.functionAppHostname.value' <<< "$outputs")/api" >> "$GITHUB_ENV"
          fi

      - name: Prepare frontend
        id: frontend
        shell: bash
        working-directory: ${{ inputs.frontend_path }}
        run: |
          set -euo pipefail
          deploy_path=""
          if [[ -f package.json ]]; then
            npm ci
            npm run build
            deploy_path="${{ inputs.frontend_path }}/${{ inputs.frontend_output_path }}"
          elif [[ -f index.html ]]; then
            deploy_path="${{ inputs.frontend_path }}"
          fi
          echo "deploy_path=$deploy_path" >> "$GITHUB_OUTPUT"

      - name: Write public MSAL configuration
        if: steps.frontend.outputs.deploy_path != ''
        env:
          DEPLOY_PATH: ${{ steps.frontend.outputs.deploy_path }}
          AUTHORITY: ${{ inputs.auth_authority }}
          CLIENT_ID: ${{ inputs.auth_client_id }}
          API_SCOPE: ${{ inputs.auth_api_scope }}
          API_BASE_URL: ${{ steps.infrastructure.outputs.function_hostname != '' && format('https://{0}/api', steps.infrastructure.outputs.function_hostname) || '/api' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const config = {
            authority: process.env.AUTHORITY || '',
            clientId: process.env.CLIENT_ID || '',
            apiScope: process.env.API_SCOPE || '',
            apiBaseUrl: process.env.API_BASE_URL || '/api'
          };
          fs.writeFileSync(path.join(process.env.DEPLOY_PATH, 'config.js'),
            'window.APP_CONFIG = ' + JSON.stringify(config, null, 2) + ';\n', { mode: 0o644 });
          NODE

      - name: Get ephemeral Static Web Apps deployment token
        if: steps.frontend.outputs.deploy_path != ''
        id: swa_token
        shell: bash
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt
          token=$(az staticwebapp secrets list \
            --name "${{ steps.infrastructure.outputs.static_web_app }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --query properties.apiKey \
            --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Azure Static Web Apps
        if: steps.frontend.outputs.deploy_path != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          action: upload
          app_location: ${{ steps.frontend.outputs.deploy_path }}
          output_location: ''
          api_location: ''
          skip_api_build: true
          skip_app_build: true

      - name: Detect Functions project
        if: inputs.profile != 'static'
        id: functions
        shell: bash
        run: |
          set -euo pipefail
          project=$(find "${{ inputs.functions_path }}" -maxdepth 2 -name '*.csproj' -print -quit 2>/dev/null || true)
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Set up .NET 8
        if: inputs.profile != 'static' && steps.functions.outputs.project != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Functions backend
        if: inputs.profile != 'static' && steps.functions.outputs.project != ''
        shell: bash
        run: dotnet publish "${{ steps.functions.outputs.project }}" -c Release -o .deploy/functions

      - name: Deploy Functions backend
        if: inputs.profile != 'static' && steps.functions.outputs.project != ''
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infrastructure.outputs.function_app }}
          package: .deploy/functions
          sku: flexconsumption


      - name: Smoke test deployed catalog API
        if: inputs.profile != 'static' && steps.functions.outputs.project != ''
        env:
          FUNCTION_HOST: ${{ steps.infrastructure.outputs.function_hostname }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://$FUNCTION_HOST/api"
          for attempt in $(seq 1 24); do
            health=$(curl --silent --show-error --fail "$base/health" || true)
            products_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/products" || true)
            if [[ "$health" == *'"status":"ok"'* && "$products_status" == "200" ]]; then
              break
            fi
            if [[ "$attempt" == "24" ]]; then
              echo "::error::Functions health or anonymous product read did not become ready."
              exit 1
            fi
            sleep 5
          done
          unauthenticated_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST "$base/products" -H 'Content-Type: application/json' \
            --data '{"name":"unauthorized smoke test","description":"","price":1,"category":"test"}')
          [[ "$unauthenticated_status" == "401" ]]

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Azure deployment complete"
            echo "- Resource group: \`${{ inputs.resource_group }}\`"
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo "- Static Web App: \`${{ steps.infrastructure.outputs.static_web_app }}\`"
            echo "- Function App: \`${{ steps.infrastructure.outputs.function_app || 'not deployed' }}\`"
            echo "- API mode: separate HTTPS endpoint with exact-origin CORS (no paid SWA backend link)"
          } >> "$GITHUB_STEP_SUMMARY"

